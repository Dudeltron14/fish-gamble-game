name: Staging

on:
  push:
    branches:
      - staging
      - staging2
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build for staging. Manual override only."
        required: true
        default: "staging"
      image_tag:
        description: "GHCR tag to publish for staging. Manual override only."
        required: true
        default: "staging"
env:
  GODOT_VERSION: 4.7.1
  REGISTRY: ghcr.io
  IMAGE_NAME: dudeltron14/fish-gamble-game
  WEB_IMAGE_NAME: dudeltron14/fish-gamble-game-web
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  export:
    name: Export staging builds
    runs-on: ubuntu-latest
    env:
      FORGEJO_LFS_TOKEN: ${{ secrets.FORGEJO_LFS_TOKEN }}
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          lfs: false

      - name: Download LFS assets from Forgejo
        run: |
          repo=$(find / -maxdepth 4 -name .git -print -quit 2>/dev/null)
          auth=$(printf 'Dudeltron14:%s' "$FORGEJO_LFS_TOKEN" | base64 -w 0)
          git -C "${repo%/.git}" config --local http.https://lfs.dudeltron14.win/.extraheader "Authorization: Basic $auth"
          git -C "${repo%/.git}" lfs pull

      - name: Install Godot Linux runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig libfontconfig1 python3

      - name: Lock client to staging lane server
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_ref = "${{ env.BUILD_REF }}"
          server_by_ref = {
              "staging": ("wss://fishserver-staging.dudeltron14.win", "Staging Server"),
              "staging2": ("wss://fishserver-staging2.dudeltron14.win", "Staging2 Server"),
          }
          server_url, server_label = server_by_ref.get(build_ref, server_by_ref["staging"])

          path = Path("src/scenes/ui/LoginScreen.gd")
          text = path.read_text()
          replacements = {
              'const SERVER_URL := "wss://fishserver.dudeltron14.win"': f'const SERVER_URL := "{server_url}"',
              'const SERVER_LABEL := "Production Server"': f'const SERVER_LABEL := "{server_label}"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected line not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          print(f"Locked Web client to {server_label}: {server_url}")
          PY

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
                ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Export Linux server binary
        run: |
          mkdir -p export/server
          godot --headless --export-release "Linux" export/server/FishGambleGame.x86_64

      - name: Export Web client
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html
          cp assets/ui/brindle_web_icon.png export/web/brindle_web_icon.png

      - name: Add Godot Web headers
        run: |
          cat > export/web/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Upload server export artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-server-export
          path: export/server/**

      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-web-export
          path: export/web/**

  docker:
    name: Build & push staging Docker images
    runs-on: ubuntu-latest
    needs: export

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download server export artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-server-export
          path: export/server

      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-web-export
          path: export/web

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging server image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Build and push staging Web client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
