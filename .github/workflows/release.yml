name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3
  REGISTRY: ghcr.io
  IMAGE_NAME: dudeltron14/fish-gamble-game

permissions:
  contents: write
  packages: write

jobs:
  export:
    name: Export Godot builds
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
                ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Export Linux server binary
        run: |
          mkdir -p export/server
          godot --headless --export-release "Linux" export/server/FishGambleGame.x86_64

      - name: Verify Linux server export
        run: |
          test -f export/server/FishGambleGame.x86_64
          test -f export/server/FishGambleGame.pck
          test -f export/server/libgdsqlite.linux.template_release.x86_64.so
          ls -lh export/server

      - name: Export Web client
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html

      - name: Verify Web export
        run: |
          test -f export/web/index.html
          test -f export/web/index.pck
          test -f export/web/index.wasm
          ls -lh export/web

      - name: Upload server export artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-export
          path: export/server/**

      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: export/web/**

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server export artifact
        uses: actions/download-artifact@v4
        with:
          name: server-export
          path: export/server

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [export, docker]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: export/web

      - name: Upload web export to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: export/web/**
          generate_release_notes: true
