name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1
  REGISTRY: ghcr.io
  IMAGE_NAME: dudeltron14/fish-gamble-game
  WEB_IMAGE_NAME: dudeltron14/fish-gamble-game-web

permissions:
  contents: write
  packages: write
  deployments: write

jobs:
  export:
    name: Export Godot builds
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: lfs.url
      GIT_CONFIG_VALUE_0: https://lfs.dudeltron14.win/Dudeltron14/Brindle.git/info/lfs
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: "!f() { echo username=Dudeltron14; echo password=${{ secrets.FORGEJO_LFS_TOKEN }}; }; f"
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot Linux runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig libfontconfig1

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
                ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Export Linux server binary
        run: |
          mkdir -p export/server
          godot --headless --export-release "Linux" export/server/FishGambleGame.x86_64

      - name: Export Web client
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html
          cp assets/ui/brindle_web_icon.png export/web/brindle_web_icon.png

      - name: Add Cloudflare Pages headers for Godot Web
        run: |
          cat > export/web/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Report Web export sizes
        run: |
          find export/web -maxdepth 1 -type f -printf '%s %p\n' \
            | sort -nr \
            | awk '{ printf "%.2f MiB  %s\n", $1 / 1048576, $2 }'

      - name: Upload server export artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-export
          path: export/server/**

      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: export/web/**

  web:
    name: Deploy Web client
    runs-on: ubuntu-latest
    needs: export
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: fish-game

    steps:
      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: export/web

      - name: Skip Cloudflare Pages deploy when secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare Pages deploy skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable fishgame.dudeltron14.win deploys."

      - name: Deploy Web client to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy export/web --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server export artifact
        uses: actions/download-artifact@v4
        with:
          name: server-export
          path: export/server

      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: export/web

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Build and push Web client Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [export, docker]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: export/web

      - name: Upload web export to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: export/web/**
          generate_release_notes: true
