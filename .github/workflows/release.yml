name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3
  REGISTRY: ghcr.io
  IMAGE_NAME: dudeltron14/fish-gamble-game

permissions:
  contents: write
  packages: write
  deployments: write

jobs:
  export:
    name: Export Godot builds
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* \
                ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Export Linux server binary
        run: |
          mkdir -p export/server
          godot --headless --export-release "Linux" export/server/FishGambleGame.x86_64

      - name: Export Web client
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html

      - name: Add Cloudflare Pages headers for Godot Web
        run: |
          cat > export/web/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Upload server export artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-export
          path: export/server/**

      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: export/web/**

  web:
    name: Deploy Web client
    runs-on: ubuntu-latest
    needs: export
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: fish-game

    steps:
      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: export/web

      - name: Skip Cloudflare Pages deploy when secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare Pages deploy skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable fishgame.dudeltron14.win deploys."

      - name: Deploy Web client to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy export/web --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server export artifact
        uses: actions/download-artifact@v4
        with:
          name: server-export
          path: export/server

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [export, docker]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download web export artifact
        uses: actions/download-artifact@v4
        with:
          name: web-export
          path: export/web

      - name: Upload web export to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: export/web/**
          generate_release_notes: true
