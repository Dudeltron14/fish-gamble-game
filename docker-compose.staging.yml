services:
  game-server-staging:
    image: ghcr.io/dudeltron14/fish-gamble-game:staging
    restart: unless-stopped
    ports:
      - "7071:7070"
    volumes:
      - ./data-staging:/app/data
    environment:
      - GODOT_HEADLESS=1

  web-client-staging:
    image: ghcr.io/dudeltron14/fish-gamble-game-web:staging
    restart: unless-stopped
    ports:
      - "8081:80"

  game-server-staging2:
    image: ghcr.io/dudeltron14/fish-gamble-game:staging2
    restart: unless-stopped
    ports:
      - "7072:7070"
    volumes:
      - ./data-staging2:/app/data
    environment:
      - GODOT_HEADLESS=1

  web-client-staging2:
    image: ghcr.io/dudeltron14/fish-gamble-game-web:staging2
    restart: unless-stopped
    ports:
      - "8082:80"
