services:
  game-server-staging:
    image: ghcr.io/dudeltron14/fish-gamble-game:staging
    restart: unless-stopped
    ports:
      - "7071:7070"
    volumes:
      - ./data-staging:/app/data
    environment:
      - GODOT_HEADLESS=1
    labels:
      - "fish-game.silo=staging"
      - "fish-game.role=game-server"
      - "fish-game.logs=admin"

  web-client-staging:
    image: ghcr.io/dudeltron14/fish-gamble-game-web:staging
    restart: unless-stopped
    ports:
      - "8081:80"

  game-server-staging2:
    image: ghcr.io/dudeltron14/fish-gamble-game:staging2
    restart: unless-stopped
    ports:
      - "7072:7070"
    volumes:
      - ./data-staging2:/app/data
    environment:
      - GODOT_HEADLESS=1
    labels:
      - "fish-game.silo=staging2"
      - "fish-game.role=game-server"
      - "fish-game.logs=admin"

  web-client-staging2:
    image: ghcr.io/dudeltron14/fish-gamble-game-web:staging2
    restart: unless-stopped
    ports:
      - "8082:80"

  admin-staging2:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8092:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-staging2:/data
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 168h
      DOZZLE_FILTER: "label=fish-game.silo=staging2,label=fish-game.role=game-server"
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_ENABLE_SHELL: "true"
      DOZZLE_NO_ANALYTICS: "true"

  admin-servers:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_EMAIL: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_NAME: Cf-Access-Authenticated-User-Email
      DOZZLE_FILTER: "label=fish-game.logs=admin"
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
