services:
  game-server:
    image: ghcr.io/dudeltron14/fish-gamble-game:latest
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      - ./data:/app/data   # SQLite DB persists outside container
    environment:
      - GODOT_HEADLESS=1
    labels:
      - "fish-game.silo=production"
      - "fish-game.role=game-server"
      - "fish-game.logs=admin"

  web-client:
    image: ghcr.io/dudeltron14/fish-gamble-game-web:latest
    restart: unless-stopped
    ports:
      - "8080:80"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup --api-version 1.40
    labels:
      - "fish-game.silo=ops"
      - "fish-game.role=watchtower"
      - "fish-game.logs=admin"
